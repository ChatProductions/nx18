name: Build native iOS18 Metal3 game-free shell

on:
  push:
    branches: [main]
    paths:
      - "LegacyShell/**"
      - "tests/test_legacy_shell_overlay.py"
      - ".github/workflows/shell18.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  native-shell:
    # Intel is an alternative capacity pool; Xcode still targets arm64-apple-ios.
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify iOS17 native-shell source overlay
        run: python3 -m unittest discover -s tests -p "test_legacy_shell_overlay.py" -v
      - name: Install shell compiler support
        run: |
          brew install xcodegen
          python3 -m pip install "fonttools>=4.0,<5"
          xcodebuild -version
      - name: Fetch real Metal3 host and game-free packaging source
        run: |
          git clone --depth 1 --branch ios16-ios17-compat \
            https://github.com/widmonstertony/nxnative.git vendor/legacy
          git clone --depth 1 --branch main \
            https://github.com/xinerqu/ns2ios-shell.git vendor/shell
          echo "Legacy source:"
          git -C vendor/legacy rev-parse HEAD
          echo "Shell source:"
          git -C vendor/shell rev-parse HEAD
      - name: Backport signed Guest loader to Metal3 host
        run: |
          python3 LegacyShell/apply_legacy_shell.py \
            --legacy vendor/legacy --shell vendor/shell
      - name: Reject newer iOS26-only APIs in the Metal3 backport
        run: |
          if grep -q 'sd.lodBias' vendor/legacy/dm/gfx/vk/hle_vk.m; then
            echo "Metal26 sampler API still present in iOS17 Vulkan fallback"
            exit 1
          fi
          if grep -R -q '.glassProminent' vendor/legacy/dm/ios/Sources; then
            echo "SwiftUI26 glass button style still present in iOS17 launcher"
            exit 1
          fi
          if grep -R -q 'MTLFXFrameInterpolatorDescriptor' vendor/legacy/dm/ios/Sources; then
            echo "MetalFX iOS26 frame interpolator still referenced in iOS17 host"
            exit 1
          fi
      - name: Build unsigned native iOS17 host using hosted Xcode
        id: build
        run: |
          bash LegacyShell/build_shell18.sh vendor/legacy "$GITHUB_WORKSPACE/build/shell18"
      - name: Record minimal runtime audit
        if: always()
        run: |
          echo "Build host: iOS17/18, Metal3, native signed-code loader; no commercial game content" > shell18-summary.txt
          git -C vendor/legacy rev-parse HEAD >> shell18-summary.txt || true
          git -C vendor/shell rev-parse HEAD >> shell18-summary.txt || true
          if [ -f build/shell18/macho-target.txt ]; then
            cat build/shell18/macho-target.txt >> shell18-summary.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nx18-metal3-shell18-diagnostics
          path: |
            shell18-summary.txt
            build/shell18/xcodebuild.log
            build/shell18/macho-target.txt
          if-no-files-found: ignore
      - name: Publish game-free shell artifact only if built
        uses: actions/upload-artifact@v4
        with:
          name: nx18-metal3-gamefree-unsigned
          path: build/shell18/nx18-metal3-gamefree-unsigned.ipa
          if-no-files-found: error

      # Publish an authoritative native-host result on the exact Git commit.
      # The GitHub connector can then inspect it without relying on Actions
      # UI scraping. Runs with no game files and no external secrets.
      - name: Publish machine-readable Metal3 build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          okay = (
              os.environ.get("BUILD_OUTCOME") == "success"
              and Path("build/shell18/nx18-metal3-gamefree-unsigned.ipa").is_file()
          )
          body = {
              "state": "success" if okay else "failure",
              "context": "nx18/metal3-native-shell",
              "description": ("Native iOS17 Metal3 host IPA built"
                              if okay else "Native host not built; see CI diagnostics"),
              "target_url": "https://github.com/{}/actions/runs/{}".format(
                  os.environ["REPOSITORY"], os.environ["RUN_ID"]),
          }
          url = "https://api.github.com/repos/{}/statuses/{}".format(
              os.environ["REPOSITORY"], os.environ["REVISION"])
          request = urllib.request.Request(url, method="POST",
              data=json.dumps(body).encode(),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              })
          with urllib.request.urlopen(request, timeout=20) as response:
              print("Published status:", body["context"], body["state"],
                    response.status)
          PY

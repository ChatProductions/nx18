name: Non-Apple Windows preflight

on:
  push:
    branches: [main]
    paths:
      - "tools/nso_probe.py"
      - "tools/rewrite_exefs.py"
      - "tools/game_targets.py"
      - "tools/build_guest18.py"
      - "tools/package_native18.py"
      - "tools/audit_cached_native.py"
      - "tests/test_cached_native.py"
      - "tests/test_nso_probe.py"
      - "tests/test_rewrite_exefs.py"
      - "tests/test_game_targets.py"
      - "tests/test_title_binding.py"
      - "tests/test_legacy_shell_overlay.py"
      - "LegacyShell/apply_legacy_shell.py"
      - "LegacyShell/NX18Guest.m"
      - "scripts/setup-windows.ps1"
      - ".github/workflows/windows-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  windows-preflight:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify native pipeline with synthetic test data
        id: test
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Show offline commands
        run: |
          python tools/nso_probe.py --help
          python tools/rewrite_exefs.py --help

      - name: Publish Windows native-pipeline test result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        shell: pwsh
        run: |
          @'
          import json, os, urllib.request
          okay = os.environ.get("TEST_OUTCOME") == "success"
          body = {
              "state": "success" if okay else "failure",
              "context": "nx18/windows-pipeline-tests",
              "description": ("Native toolchain regression tests passed"
                              if okay else "Native pipeline tests failed; see run"),
              "target_url": "https://github.com/{}/actions/runs/{}".format(
                  os.environ["REPOSITORY"], os.environ["RUN_ID"]),
          }
          url = "https://api.github.com/repos/{}/statuses/{}".format(
              os.environ["REPOSITORY"], os.environ["REVISION"])
          req = urllib.request.Request(url, method="POST",
              data=json.dumps(body).encode(), headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              })
          with urllib.request.urlopen(req, timeout=20) as resp:
              print("Published", body["context"], body["state"], resp.status)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Cannot publish Windows CI result" }

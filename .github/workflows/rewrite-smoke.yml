name: Real native NSO rewrite smoke test (Windows)
on:
  push:
    branches: [main]
    paths:
      - "tools/rewrite_exefs.py"
      - "tools/build_guest18.py"
      - "tools/game_targets.py"
      - "LegacyShell/**"
      - "tests/smoke_native18_packaging.py"
      - "tools/nso_probe.py"
      - "tests/test_rewrite_exefs.py"
      - "tests/test_nso_probe.py"
      - ".github/workflows/rewrite-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-native-rewrite:
    name: Run actual nxnative rewriter on synthetic ARM64 NSO
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rewriter dependencies (no Apple tools)
        run: python -m pip install "capstone>=5,<6" "lz4>=4,<5"
      - name: Clone legacy native renderer/rewriter
        shell: pwsh
        run: |
          git clone --filter=blob:none --depth 1 --branch ios16-ios17-compat https://github.com/widmonstertony/nxnative.git vendor/nxnative
          if ($LASTEXITCODE -ne 0) { throw "Failed to clone legacy nxnative fork" }
          git -C vendor/nxnative rev-parse HEAD
      - name: Prepare iOS17 Guest framework generator from open source
        run: |
          git clone --depth 1 --branch main https://github.com/xinerqu/ns2ios-shell.git vendor/shell
          python LegacyShell/apply_legacy_shell.py --legacy vendor/nxnative --shell vendor/shell
      - name: Generate non-copyrighted synthetic Switch ARM64 module
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import struct
          target = Path("work") / "synthetic" / "exefs"
          target.mkdir(parents=True, exist_ok=True)
          header = bytearray(0x100)
          header[:4] = b"NSO0"
          # Three 0x1000-byte uncompressed segments, aligned guest memory.
          for i in range(3):
              struct.pack_into("<III", header, 0x10 + i * 16,
                               0x100 + i * 0x1000, i * 0x1000, 0x1000)
          # Real nxnative requires a Horizon module header (MOD0) with a
          # valid eh_frame_hdr table, even when the ARM64 code is synthetic.
          # Merely filling all three segments with NOPs is not a valid NSO.
          text = bytearray(b"\x1f\x20\x03\xd5" * 1024)
          text[:4] = b"\xc0\x03\x5f\xd6"  # RET at guest 0
          struct.pack_into("<I", text, 4, 0x1000)  # MOD0 guest VA
          text[0x20:0x24] = b"\xc0\x03\x5f\xd6"  # Synthetic function
          ro = bytearray(0x1000)
          ro[:4] = b"MOD0"
          struct.pack_into("<i", ro, 0x10, 0x40)  # eh_frame_hdr offset
          # DWARF eh_frame_hdr v1: abs 32-bit pointer/count/table columns.
          ro[0x40:0x44] = bytes([1, 3, 3, 3])
          struct.pack_into("<IIII", ro, 0x44, 0x1100, 1, 0x20, 0x1100)
          (target / "main").write_bytes(
              header + text + ro + bytes(0x1000)
          )
          print("Fixture:", target / "main")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Fixture generation failed" }
      - name: Run production nx18 wrapper against REAL nxnative rewriter
        run: >
          python tools/rewrite_exefs.py
          work/synthetic/exefs
          --upstream vendor/nxnative
          --output work/rewrite
          --title-id 0100B51020B68000
          --jobs 2
      - name: Build iOS17 signed-code Guest.framework from rewritten ARM64 module
        run: >
          python tools/build_guest18.py
          --rewritten work/rewrite
          --legacy vendor/nxnative
          --out work/native
      - name: Verify framework Mach-O targets iOS17, not 26
        shell: pwsh
        run: |
          @'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "tools"))
          from build_guest18 import macho_minos, MINOS_17
          lib = Path("work/native/Guest.framework/Guest")
          report = json.loads(Path("work/native/guest18-manifest.json").read_text())
          assert macho_minos(lib) == MINOS_17
          assert report["modules"] == ["main"]
          assert not report["embedded_in_ipa"]
          print("PASS: signed native ARM64 guest code container targets iOS17.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Guest framework validation failed" }
      - name: Assemble synthetic Terminator native IPA scaffold (no real game)
        run: >
          python tests/smoke_native18_packaging.py
          --legacy vendor/nxnative
          --rewritten work/rewrite
          --native work/native
      - name: Check native output and manifest
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json
          out = Path("work/rewrite")
          manifest = json.loads((out / "rewrite-manifest.json").read_text())
          assert manifest["modules"][0]["name"] == "main"
          assert manifest["source_revision"]
          assert manifest["host_or_ipa_built"] is False
          assert (out / "main.patched.bin").stat().st_size > 0
          assert (out / "main.fixups.tsv").stat().st_size > 0
          print("PASS: real rewriter generated a native image and fixup data.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Rewrite audit failed" }
      - name: Publish synthetic rewrite manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nx18-native-rewrite-smoke-report
          path: |
            work/rewrite/rewrite-manifest.json
            work/native/guest18-manifest.json
          if-no-files-found: ignore
